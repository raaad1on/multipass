# Template: placeholders are substituted by docker-entrypoint.sh at container start.
# Socket paths and SNI come from docker-compose environment (see compose header).

global
    # warning+: no per-connection tcplog (keeps docker logs small)
    log stdout format raw local0 warning
    maxconn 200000
    # nbthread omitted: HAProxy auto-sets threads to available CPUs (2..80+ cores).
    tune.bufsize 32768
    tune.maxrewrite 1024

defaults
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client  300s
    timeout server  300s
    timeout tunnel  1h
    # Optional health checks (disabled by default):
    # option tcp-check
    # tcp-check connect

frontend fe_tls
    bind :${LISTEN_PORT}
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    acl is_xhttp req_ssl_sni -i ${XHTTP_SNI}
    acl is_grpc  req_ssl_sni -i ${GRPC_SNI}

    use_backend be_xhttp if is_xhttp
    use_backend be_grpc  if is_grpc
    default_backend be_reality

backend be_xhttp
    mode tcp
    server xhttp unix@${XHTTP_SOCK_PATH} send-proxy-v2

backend be_grpc
    mode tcp
    server grpc unix@${GRPC_SOCK_PATH} send-proxy-v2

backend be_reality
    mode tcp
    server reality unix@${REALITY_SOCK_PATH} send-proxy-v2
