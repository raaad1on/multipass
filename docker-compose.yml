# multipass — HAProxy L4 SNI router + Unix socket bridges to Xray TCP
#
# multipass CREATES and LISTENS on Unix sockets, then socat-forwards to Xray.
# Xray/Remnawave must listen on TCP upstreams (not on the sockets).
#
# Routing (TCP passthrough, no TLS termination):
#   xhttp-${NODE_HOST} -> xhttp.sock  -> XHTTP_UPSTREAM
#   grpc-${NODE_HOST}  -> grpc.sock   -> GRPC_UPSTREAM
#   *                  -> reality.sock -> REALITY_UPSTREAM
#
# Docs: README.md

services:
  multipass:
    image: ghcr.io/raaad1on/multipass:latest
    container_name: multipass
    restart: unless-stopped
    network_mode: host
    volumes:
      - /dev/shm/nginx:/dev/shm/nginx
    environment:
      NODE_HOST: de02.example.com
      LISTEN_PORT: "443"
      # Optional SNI overrides (defaults: xhttp-${NODE_HOST}, grpc-${NODE_HOST}):
      # XHTTP_SNI: xhttp-de02.example.com
      # GRPC_SNI: grpc-de02.example.com
      XHTTP_SOCK_PATH: /dev/shm/nginx/xhttp.sock
      GRPC_SOCK_PATH: /dev/shm/nginx/grpc.sock
      REALITY_SOCK_PATH: /dev/shm/nginx/reality.sock
      # Xray TCP listeners (Remnawave inbounds):
      REALITY_UPSTREAM: 127.0.0.1:10443
      XHTTP_UPSTREAM: 127.0.0.1:10444
      GRPC_UPSTREAM: 127.0.0.1:10445
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
